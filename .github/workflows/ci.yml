name: CI / CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make install

      - name: Ruff cs check
        run: make ruff-cs-check

      - name: Ruff linter check
        run: make ruff-linter-check

      - name: Mypy check
        run: make mypy-check

      - name: Tests
        run: make test

  docker:
    runs-on: ubuntu-24.04
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/anikitin52/unn-2026-nikitin-test:latest
            ghcr.io/anikitin52/unn-2026-nikitin-test:${{ github.sha }}
